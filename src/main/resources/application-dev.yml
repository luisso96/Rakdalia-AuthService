spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/auth_db
    username: auth_user
    password: password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: true

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: auth-service-group

  data:
    redis:
      host: localhost
      port: 6379
  web:
    error:
      include-message: always
      include-stacktrace: on_param
      include-binding-errors: always
      include-exception: true

springdoc:
  packages-to-scan: es.luis.almendros.authservice.infrastructure.web
  paths-to-match: /auth/**

jwt:
  expiration: 3600000
  refresh-expiration: 604800000
  secret: dev-secret-key-para-desarrollo-no-usar-en-produccion-32chars

logging:
  level:
    com.portfolio.auth: DEBUG
    org.springframework.web: INFO
    org.springdoc: DEBUG