spring:
  profiles:
    active: dev
  application:
    name: auth-service

server:
  port: 8081

jwt:
  expiration: 3600000
  refresh-expiration: 604800000
  secret: dev-secret-key-para-desarrollo-no-usar-en-produccion-32chars

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always